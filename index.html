<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Trading Journal Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.5rem; }
        .day-cell { min-height: 80px; background-color: #1e293b; border-radius: 0.5rem; padding: 0.5rem; cursor: pointer; border: 1px solid #334155; }
        .day-cell:hover { border-color: #64748b; }
        .positive { color: #22c55e; }
        .negative { color: #ef4444; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-5xl mx-auto space-y-6">
        <h1 class="text-3xl font-bold text-center mb-8">Trading Journal Pro</h1>
        
        <!-- Dashboard -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-slate-400 text-sm">Initial Capital</p>
                <input type="number" id="initialCapital" class="bg-slate-900 border border-slate-600 rounded p-1 w-full mt-1 text-white" placeholder="0.00">
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-slate-400 text-sm">Total Current Balance</p>
                <p id="totalBalance" class="text-2xl font-bold">₱0.00</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-slate-400 text-sm">All-Time Net Profit</p>
                <p id="allTimeProfit" class="text-2xl font-bold">₱0.00</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-slate-400 text-sm">Net Deposits/Withdrawals</p>
                <p id="netTransfers" class="text-2xl font-bold">₱0.00</p>
            </div>
        </div>

        <!-- Monthly Summary -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <button id="prevMonth" class="px-3 py-1 bg-slate-700 rounded hover:bg-slate-600">&lt;</button>
                <span id="currentMonthYear" class="mx-4 text-xl font-semibold w-40 inline-block text-center">October 2026</span>
                <button id="nextMonth" class="px-3 py-1 bg-slate-700 rounded hover:bg-slate-600">&gt;</button>
            </div>
            <div class="flex gap-4 text-sm w-full md:w-auto justify-between">
                <div>Monthly P&L: <br><span id="monthPL" class="font-bold text-lg">₱0.00</span></div>
                <div>Monthly Dep: <br><span id="monthDep" class="text-green-500 font-bold text-lg">₱0.00</span></div>
                <div>Monthly With: <br><span id="monthWith" class="text-red-500 font-bold text-lg">₱0.00</span></div>
            </div>
        </div>

        <!-- Calendar -->
        <div class="calendar-grid text-center text-sm font-bold text-slate-400 mb-2">
            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        <div id="calendar" class="calendar-grid"></div>

    </div>

    <!-- Modal -->
    <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4">
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 w-full max-w-md">
            <h2 id="modalDate" class="text-xl font-bold mb-4">Date</h2>
            <div class="space-y-4">
                <div><label class="block text-sm text-slate-400">Number of Trades</label><input type="number" id="tradesInput" class="w-full bg-slate-900 border border-slate-600 rounded p-2 mt-1"></div>
                <div><label class="block text-sm text-slate-400">Daily P&L (₱)</label><input type="number" id="plInput" class="w-full bg-slate-900 border border-slate-600 rounded p-2 mt-1"></div>
                <div><label class="block text-sm text-slate-400 text-green-500">Deposit (₱)</label><input type="number" id="depInput" class="w-full bg-slate-900 border border-slate-600 rounded p-2 mt-1"></div>
                <div><label class="block text-sm text-slate-400 text-red-500">Withdrawal (₱)</label><input type="number" id="withInput" class="w-full bg-slate-900 border border-slate-600 rounded p-2 mt-1"></div>
            </div>
            <div class="mt-6 flex justify-end gap-2">
                <button id="closeModal" class="px-4 py-2 bg-slate-700 rounded hover:bg-slate-600">Cancel</button>
                <button id="saveData" class="px-4 py-2 bg-blue-600 rounded hover:bg-blue-500 text-white font-bold">Save</button>
            </div>
        </div>
    </div>

    <script>
        // Data Structure
        let data = JSON.parse(localStorage.getItem('tradeData')) || {};
        let initialCapital = parseFloat(localStorage.getItem('initialCapital')) || 0;
        
        document.getElementById('initialCapital').value = initialCapital || '';
        document.getElementById('initialCapital').addEventListener('change', (e) => {
            initialCapital = parseFloat(e.target.value) || 0;
            localStorage.setItem('initialCapital', initialCapital);
            updateDashboard();
        });

        let currentDate = new Date();
        let selectedDateStr = null;

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('currentMonthYear').textContent = new Date(year, month).toLocaleString('default', { month: 'long', year: 'numeric' });
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            const calendar = document.getElementById('calendar');
            calendar.innerHTML = '';
            
            for (let i = 0; i < firstDay; i++) {
                calendar.innerHTML += `<div class="day-cell opacity-20 cursor-default"></div>`;
            }
            
            let mPL = 0, mDep = 0, mWith = 0;

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month+1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayData = data[dateStr] || { trades: 0, pl: 0, dep: 0, with: 0 };
                
                mPL += parseFloat(dayData.pl) || 0;
                mDep += parseFloat(dayData.dep) || 0;
                mWith += parseFloat(dayData.with) || 0;

                let plClass = dayData.pl > 0 ? 'positive' : (dayData.pl < 0 ? 'negative' : 'text-slate-400');
                
                calendar.innerHTML += `
                    <div class="day-cell flex flex-col justify-between" onclick="openModal('${dateStr}')">
                        <span class="text-xs font-bold text-slate-500">${day}</span>
                        ${dayData.trades > 0 || dayData.pl != 0 || dayData.dep > 0 || dayData.with > 0 ? `
                        <div class="text-xs space-y-1">
                            <div class="${plClass} font-bold">₱${(dayData.pl||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})}</div>
                            ${dayData.trades > 0 ? `<div class="text-slate-400">${dayData.trades} trades</div>` : ''}
                            ${dayData.dep > 0 ? `<div class="text-green-500">+₱${dayData.dep.toLocaleString()}</div>` : ''}
                            ${dayData.with > 0 ? `<div class="text-red-500">-₱${dayData.with.toLocaleString()}</div>` : ''}
                        </div>
                        ` : ''}
                    </div>
                `;
            }
            
            document.getElementById('monthPL').textContent = `₱${mPL.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})}`;
            document.getElementById('monthPL').className = `font-bold text-lg ${mPL >= 0 ? 'positive' : 'negative'}`;
            document.getElementById('monthDep').textContent = `₱${mDep.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})}`;
            document.getElementById('monthWith').textContent = `₱${mWith.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})}`;
            
            updateDashboard();
        }

        function updateDashboard() {
            let tPL = 0, tDep = 0, tWith = 0;
            for (let key in data) {
                tPL += parseFloat(data[key].pl) || 0;
                tDep += parseFloat(data[key].dep) || 0;
                tWith += parseFloat(data[key].with) || 0;
            }
            
            const totalBalance = initialCapital + tPL + tDep - tWith;
            const netTransfers = tDep - tWith;

            document.getElementById('totalBalance').textContent = `₱${totalBalance.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})}`;
            document.getElementById('allTimeProfit').textContent = `₱${tPL.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})}`;
            document.getElementById('allTimeProfit').className = `text-2xl font-bold ${tPL >= 0 ? 'positive' : 'negative'}`;
            document.getElementById('netTransfers').textContent = `₱${netTransfers.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})}`;
            document.getElementById('netTransfers').className = `text-2xl font-bold ${netTransfers >= 0 ? 'positive' : 'negative'}`;
        }

        document.getElementById('prevMonth').onclick = () => { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); };
        document.getElementById('nextMonth').onclick = () => { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); };

        function openModal(dateStr) {
            selectedDateStr = dateStr;
            document.getElementById('modalDate').textContent = dateStr;
            const d = data[dateStr] || {};
            document.getElementById('tradesInput').value = d.trades || '';
            document.getElementById('plInput').value = d.pl || '';
            document.getElementById('depInput').value = d.dep || '';
            document.getElementById('withInput').value = d.with || '';
            document.getElementById('modal').classList.remove('hidden');
        }

        document.getElementById('closeModal').onclick = () => document.getElementById('modal').classList.add('hidden');
        
        document.getElementById('saveData').onclick = () => {
            const trades = parseInt(document.getElementById('tradesInput').value) || 0;
            const pl = parseFloat(document.getElementById('plInput').value) || 0;
            const dep = parseFloat(document.getElementById('depInput').value) || 0;
            const withAmount = parseFloat(document.getElementById('withInput').value) || 0;
            
            if (trades === 0 && pl === 0 && dep === 0 && withAmount === 0) {
                delete data[selectedDateStr];
            } else {
                data[selectedDateStr] = { trades, pl, dep, with: withAmount };
            }
            
            localStorage.setItem('tradeData', JSON.stringify(data));
            document.getElementById('modal').classList.add('hidden');
            renderCalendar();
        };

        renderCalendar();

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(r => console.log('SW registered'))
                    .catch(e => console.log('SW fail', e));
            });
        }
    </script>
</body>
</html>
